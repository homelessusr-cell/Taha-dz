<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taha dz - Modern Dashboard</title>
    <style>
        /* Modern CSS Variables for easy color management */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #4ade80;
            --accent-blue: #38bdf8;
            --btn-hover: #0ea5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
        }

        /* Glassmorphism Main Container */
        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .main-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        /* Title Styling */
        .title-badge {
            display: inline-block;
            color: var(--accent-green);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--accent-green);
            padding-bottom: 5px;
        }

        /* Action Section */
        .download-box {
            margin-bottom: 35px;
        }

        .section-label {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        /* Beautiful Animated Install Button */
        .download-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent-blue);
            color: #0f172a;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .download-button:hover {
            background: var(--btn-hover);
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }

        /* Summary Segment styling */
        .summary-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            padding: 20px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Clean template skeleton bars for the summary area */
        .placeholder-lines {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .line {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .line.long  { width: 100%; }
        .line.med   { width: 85%; }
        .line.short { width: 50%; }

        /* Elegant Minimal Footer */
        .footer-credits {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .credit-item span {
            color: var(--text-main);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <main class="main-card">
        <!-- Brand Title -->
        <div class="title-badge">Taha dz</div>

        <!-- Download Action -->
        <div class="download-box">
            <div class="section-label">Download Here</div>
            <a href="#" class="download-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                The Link to Install
            </a>
        </div>

        <!-- Summary Concept View -->
        <div class="summary-box">
            <div class="section-label" style="margin-bottom: 4px;">Summary</div>
            <div class="placeholder-lines">
                <div class="line long"></div>
                <div class="line med"></div>
                <div class="line short"></div>
            </div>
        </div>
    </main>

    <!-- Professional Attribution Footer -->
    <footer class="footer-credits">
        <div class="credit-item">App made by: <span>[Developer Name]</span></div>
        <div class="credit-item">Site designer: <span>[Designer Name]</span></div>
    </footer>

</body>
</html>
